[package]
name = "infernal_diffusion"
version = "0.7.6"
edition = "2021"
description = "Deterministic procedural monster generation with a portable C ABI"
license = "MIT AND Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "infernal"
path = "src/main.rs"

[features]
default = ["bert"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde_bytes", "dep:js-sys"]
wasm-threads = ["wasm", "dep:wasm-bindgen-rayon"]
bert = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
prost = "0.14"
ciborium = "0.2"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rapier2d = { version = "0.35", features = ["enhanced-determinism"] }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["unstable_wasm"] }
# Candle and tokenizers share the browser Web Crypto entropy backend.
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2.104", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_bytes = { version = "0.11", optional = true }
web-time = "1"
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }

[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
