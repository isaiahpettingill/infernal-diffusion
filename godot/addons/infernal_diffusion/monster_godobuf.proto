// Generated from proto/monster.proto for Godobuf 0.7.0.
// Only the unsupported package declaration is removed; field numbers stay identical.
syntax = "proto3";

message Monster {
  uint32 format_version = 1;
  string id = 2;
  string display_name = 3;
  GenerationInfo generation = 4;
  SpriteSet sprites = 5;
  PhysicsInfo physics = 6;
  GameplayInfo gameplay = 7;
  repeated Animation animations = 8;
  repeated Attack attacks = 9;
  repeated Collider colliders = 10;
  repeated MovementMode movement_modes = 11;
  repeated string tags = 12;
  string description = 13;
  BehaviorInfo behavior = 14; // Optional legacy demo-AI hints; engines may ignore.
  repeated Projectile projectiles = 15;
  SizeInfo size = 16;
  MountInfo mount = 17;
  V2Profile v2_profile = 18; // Absent in V1; declarative capabilities, never an AI controller.
}
// Paths are package-relative and point to complete child monster packages.
message MountInfo {
  string rider_package = 1;
  string mount_package = 2;
  string survivor = 3; // RIDER or MOUNT after composite death.
}
message SpawnInfo {
  string package_path = 1;
  string monster_id = 2;
  uint32 count = 3;
  uint32 max_active = 4;
}
// Morphology is already baked at a shared pixel scale; do not scale the atlas again.
message SizeInfo {
  float normalized_size = 1;
  string size_class = 2;
  float morphology_scale = 3;
  float pixels_per_unit = 4;
  uint32 visible_width_px = 5;
  uint32 visible_height_px = 6;
  float anchor_x_px = 7;
  float anchor_y_px = 8;
}
// Deprecated integration surface: demo-AI preferences, never required engine policy.
message BehaviorInfo {
  string style = 1;
  float aggro_range = 2;
  float preferred_range = 3;
  float aggression = 4;
  float retreat_health_fraction = 5;
  string approach_mode = 6;
  string escape_mode = 7;
  repeated AttackPreference attack_preferences = 8;
}
message AttackPreference {string attack_id = 1; float weight = 2;}
message GenerationInfo {
  string generator_version = 1;
  string recipe_version = 2;
  string prompt = 3;
  uint64 seed = 4;
  string parser = 5;
  float parser_confidence = 6;
  repeated string repairs = 7;
  repeated string recipe_ids = 8;
  repeated SemanticConfidence confidences = 9;
  repeated TokenEvidence token_evidence = 10;
}
message SemanticConfidence {string key = 1; float confidence = 2;}
message TokenEvidence {string label = 1; uint32 start = 2; uint32 end = 3; float confidence = 4;}
message SpriteSet {
  string image_file = 1;
  uint32 frame_width = 2;
  uint32 frame_height = 3;
  uint32 columns = 4;
  uint32 frame_count = 5;
  uint32 palette_size = 6;
  string emission_file = 7;
  repeated float direction_angles_deg = 8;
  uint32 direction_stride = 9;
  string render_mode = 10;
}
message PhysicsInfo {
  float mass = 1;
  float gravity_scale = 2;
  float speed = 3;
  float knockback_scale = 4;
  float center_of_mass_x = 5;
  float center_of_mass_y = 6;
  repeated string side_effects = 7;
}
message GameplayInfo {
  uint32 health = 1;
  uint32 defense = 2;
  float threat = 3;
  uint32 health_size_bonus = 4;
  uint32 health_armor_bonus = 5;
  uint32 health_magic_bonus = 6;
}
message Animation {
  string id = 1;
  string semantic_state = 2;
  repeated AnimationFrame frames = 3;
  repeated AnimationEvent events = 4;
  bool looped = 5;
  string movement_mode = 6;
}
// Root deltas are advisory generator-length units per frame, +X forward / -Y up.
// Controller-driven engines may ignore them; do not apply velocity and root deltas twice.
message AnimationFrame { uint32 sprite_frame_id = 1; uint32 duration_ms = 2; float root_dx = 3; float root_dy = 4; }
message AnimationEvent { uint32 time_ms = 1; string kind = 2; string reference_id = 3; }
message Attack {
  string id = 1;
  string delivery = 2;
  string element = 3;
  string origin_node = 4;
  uint32 damage = 5;
  uint32 telegraph_ms = 6;
  uint32 cooldown_ms = 7;
  float range = 8;
  string animation_id = 9;
  repeated AttackStep steps = 10;
  string projectile_id = 11;
  SpawnInfo spawn = 12;
}
message Projectile {
  string id = 1;
  string kind = 2;
  string image_file = 3;
  uint32 frame_width = 4;
  uint32 frame_height = 5;
  uint32 columns = 6;
  uint32 first_frame = 7;
  uint32 frame_count = 8;
  uint32 frame_duration_ms = 9;
  float collision_radius = 10;
  string orientation_mode = 11;
}
// Legacy demo recipes: targets and movement paths are optional engine hints.
// Motion steps (DASH, LEAP, SWOOP, BURROW, TELEPORT, DODGE) start at
// at_ms and travel for duration_ms. A later hit step determines impact time.
message AttackStep {
  string primitive = 1;
  uint32 at_ms = 2;
  float value = 3;
  string target = 4;
  uint32 count = 5;
  float spread_deg = 6;
  float speed = 7;
  float radius = 8;
  uint32 duration_ms = 9;
}
message Collider { string id = 1; string node_id = 2; float x = 3; float y = 4; float radius = 5; bool hurtbox = 6; repeated ColliderView views = 7; }
message ColliderView { uint32 direction_index = 1; float x = 2; float y = 3; float radius = 4; }
// Additive capability contract; old fields and wire numbers are unchanged.
// Engines choose controllers, targets, paths and pacing from category/modifiers.
message MovementMode {
  string id = 1; // Stable legacy gait/clip key, not a behavior to execute.
  float speed = 2; // Reference generator-length units / second; engine may override.
  string animation_id = 3; // ID in Monster.animations, never a sprite frame index.
  string category = 4; // GROUNDED, AERIAL, SWIMMING, CLIMBING, BURROWING, STATIONARY.
  repeated string modifiers = 5; // Unordered qualifiers; ignore unrecognized values.
}

message V2Profile {
  uint32 profile_version = 1;
  repeated string categories = 2;
  repeated string capabilities = 3;
  repeated string modifiers = 4;
  repeated AttackPatternDescriptor attack_patterns = 5;
  LureDescriptor lure = 6;
  SpectralDescriptor spectral = 7;
  HybridRecipeDescriptor hybrid = 8;
  repeated BodyMotionSample body_motion_samples = 9;
  EncounterDescriptor encounter = 10;
  repeated string damage_traits = 11; // Engine-tunable defense categories, not numeric balance.
}

message AttackPatternDescriptor {
  string attack_id = 1;
  string pattern = 2;
  uint32 projectile_count = 3;
  uint32 volley_count = 4;
  uint32 interval_ms = 5;
  float spread_deg = 6;
  string aim_mode = 7;
  repeated AttackOriginSample motion_samples = 8;
}

message LureDescriptor {
  string lure_animation_id = 1;
  string reveal_animation_id = 2;
  string trigger = 3;
  float trigger_radius = 4;
  string attack_id = 5;
  string effect = 6;
  bool harmless = 7;
  uint32 telegraph_ms = 8;
  string distant_state = 9;
  string revealed_state = 10;
  string reset_policy = 11;
}

// Damage rules are evaluated by descending priority, first match wins.
// Every nonempty criterion must match; listed elements are alternatives.
message SpectralDescriptor {
  string kind = 1;
  string visual_style = 2;
  float opacity = 3;
  string collision_mode = 4;
  repeated DamageRule damage_rules = 5;
  float default_damage_multiplier = 6;
  bool default_projectile_pass_through = 7;
  repeated PhaseWindow phase_windows = 8;
}
message DamageRule {
  uint32 priority = 1;
  repeated string elements = 2;
  string delivery = 3;
  string required_tag = 4;
  float damage_multiplier = 5;
  bool projectile_pass_through = 6;
}
message PhaseWindow {
  string animation_id = 1;
  uint32 start_ms = 2;
  uint32 end_ms = 3;
  bool solid_pass_through = 4;
}

message HybridRecipeDescriptor {
  uint32 schema_version = 1;
  string upper_body = 2;
  string lower_body = 3;
  string head = 4;
  uint32 lower_limb_count = 5;
  uint32 upper_arm_count = 6;
}

// Baked posed hit-origin tracks, not autonomous movement instructions.
message AttackOriginSample {
  uint32 time_ms = 1;
  uint32 sprite_frame_id = 2;
  string node_id = 3;
  repeated ColliderView views = 4;
  bool active = 5;
}

message BodyMotionSample {
  string animation_id = 1;
  uint32 time_ms = 2;
  uint32 sprite_frame_id = 3;
  repeated PosedHurtbox hurtboxes = 4;
}
message PosedHurtbox {
  string node_id = 1;
  repeated ColliderView views = 2;
}

// Declarative capabilities; the engine owns state transitions and physics.
message EncounterDescriptor {
  uint32 contract_version = 1;
  string archetype = 2;
  SplitDescriptor split = 3;
  MimicDescriptor mimic = 4;
  ShieldDescriptor shield = 5;
  PushedPropDescriptor pushed_prop = 6;
}

// Declarative capabilities; the engine owns state transitions and physics.
message SplitDescriptor {
  uint32 count = 1;
  uint32 max_generations = 2;
  uint32 max_offspring = 3;
  float child_scale = 4;
  float child_health_fraction = 5;
  float child_speed_multiplier = 6;
  uint32 emergence_ms = 7;
  float separation_px = 8;
  string emergence_animation_id = 9;
  string burst_animation_id = 10;
}

// Declarative capabilities; the engine owns state transitions and physics.
message MimicDescriptor {
  string disguise = 1;
  float trigger_radius = 2;
  uint32 reveal_ms = 3;
}

// Declarative capabilities; the engine owns state transitions and physics.
message ShieldDescriptor {
  float front_arc_degrees = 1;
  uint32 bash_windup_ms = 2;
  uint32 bash_recovery_ms = 3;
  string guard_animation_id = 4;
  string bash_animation_id = 5;
  string recovery_animation_id = 6;
}

// Declarative capabilities; the engine owns state transitions and physics.
message PushedPropDescriptor {
  string kind = 1;
  string id_suffix = 2;
  float radius = 3;
  float health = 4;
  float push_speed = 5;
  string coordinate_space = 6;
  float anchor_x = 7;
  float anchor_y = 8;
  string push_animation_id = 9;
  string recovery_animation_id = 10;
  string release_event = 11;
}
