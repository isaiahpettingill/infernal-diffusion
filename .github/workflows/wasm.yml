name: WASM bundled BERT browser generator
on:
  push:
    paths: ["src/**", "assets/**", "models/**", "Cargo.toml", "Cargo.lock", "tools/build_wasm.sh", "web/wasm/**", ".github/workflows/wasm.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish approved portable demo to Pages (leave false until final user go-ahead)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        threaded: [0, 1]
    env:
      WASM_THREADED: ${{ matrix.threaded }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install optional threaded toolchain
        if: matrix.threaded == 1
        run: rustup toolchain install nightly-2026-10-12 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/wasm/package-lock.json
      - name: Install pinned official WASM tools
        shell: bash
        run: |
          curl -fL --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar xz
          echo "$PWD/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_130/bin" >> "$GITHUB_PATH"
      - name: Test deterministic parser and preserved recipes
        run: cargo test --locked --no-default-features --lib parser
      - name: Build full optimized BERT WASM
        run: tools/build_wasm.sh
      - name: Test actual portable WASM worker with offline Node host adapters
        if: matrix.threaded == 0
        run: |
          node web/wasm/tests/worker.actual-wasm.node.mjs
          node web/wasm/tests/budget.actual-wasm.node.mjs
      - name: Install browser tests
        working-directory: web/wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test real BERT browser worker, responsiveness and cancellation
        working-directory: web/wasm
        run: npm test
      - name: Record exact artifact revision
        run: python3 -c 'import json,os; open("web/wasm/build-info.json","w").write(json.dumps({"commit":os.environ["GITHUB_SHA"],"run_id":os.environ["GITHUB_RUN_ID"]}))'
      - uses: actions/upload-artifact@v4
        with:
          name: infernal-wasm32-bert-threads-${{ matrix.threaded }}
          path: |
            web/wasm/pkg/
            web/wasm/bundle-manifest.json
            web/wasm/build-info.json
            web/wasm/client.js
            web/wasm/worker.js
            web/wasm/index.html
            web/wasm/demo.js
            web/wasm/play/
            web/wasm/prompt-controls.js
            web/wasm/server.py
            web/wasm/README.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wasm-browser-failure-threads-${{ matrix.threaded }}
          path: web/wasm/test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-browser-evidence-threads-${{ matrix.threaded }}
          path: |
            web/wasm/test-results/**/playground-v2.png
            web/wasm/test-results/**/playable-monster.png
            web/wasm/test-results/**/attachments/*.json
          if-no-files-found: ignore

  deploy-approved-demo:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-playground]')))
    needs: wasm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: infernal-wasm32-bert-threads-0
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish approved demo
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify published revision and playable audio route
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, time, urllib.request
          base = os.environ["SITE_URL"].rstrip("/") + "/"
          def read(path):
              with urllib.request.urlopen(base + path, timeout=30) as response:
                  return response.read()
          for attempt in range(60):
              try:
                  info = json.loads(read("build-info.json"))
                  assert info["commit"] == os.environ["GITHUB_SHA"], "Published revision has not propagated"
                  assert b'id="audio-enable"' in read("play/"), "Playable audio controls missing"
                  catalog = json.loads(read("play/audio/catalog.json"))
                  source = next(a for a in catalog["assets"] if a["id"] == "wilhelm-scream")
                  audio = read("play/audio/" + source["file"])
                  assert hashlib.sha256(audio).hexdigest() == source["verification"]["sha256"], "Published audio checksum mismatch"
                  print("Verified published commit", info["commit"], "and playable audio at", base + "play/")
                  break
              except Exception as error:
                  if attempt == 59:
                      raise
                  print("Waiting for Pages propagation:", type(error).__name__)
                  time.sleep(10)
          PYVERIFY
