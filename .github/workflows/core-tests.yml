name: Procedural profile contracts
on:
  push:
    paths: ["src/**", "tests/**", "examples/**", "tools/check_v1_compatibility.py", "Cargo.toml", "Cargo.lock", ".github/workflows/core-tests.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release ${{ matrix.features }}
      - name: Exercise local playground profiles over HTTP
        run: |
          cargo build --locked --release ${{ matrix.features }} --bin infernal
          python3 tools/smoke_playground.py --expect-parser ${{ matrix.features == '' && 'embedded-bert' || 'vocabulary' }}
          node --test web/combat.test.cjs web/wasm/tests/profiles.node.mjs
      - name: Install local Arena browser checks
        if: matrix.features == ''
        working-directory: web/wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test actual BERT server and selected animation playback
        if: matrix.features == ''
        working-directory: web/wasm
        run: npx playwright test --config arena.config.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.features == ''
        with:
          name: local-bert-playground-evidence
          path: web/wasm/test-results/
          if-no-files-found: ignore
      - if: matrix.features == '--no-default-features'
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

  v1-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 6f0c9b31eabfdc9e1b593cf1c3621f75d63dd9f3
          path: .v1-reference
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build candidate and pinned baseline with the same compiler
        run: |
          cargo build --locked --release --no-default-features --bin infernal
          cargo build --locked --release --no-default-features --manifest-path .v1-reference/Cargo.toml --target-dir target/v1-reference --bin infernal
      - name: Require byte-identical terrestrial V1 outputs
        run: python tools/check_v1_compatibility.py --baseline target/v1-reference/release/infernal --candidate target/release/infernal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-compatibility-report
          path: v1-compatibility-report.json
