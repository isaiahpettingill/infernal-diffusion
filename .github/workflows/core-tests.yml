name: Procedural profile contracts
on:
  push:
    paths: ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", ".github/workflows/core-tests.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        features: ["", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release ${{ matrix.features }}
      - if: matrix.features == '--no-default-features'
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
