name: Godot desktop binaries

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "models/**"
      - "godot/**"
      - "tools/build_gdextension.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/godot-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: windows-latest, target: i686-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04, target: i686-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install 32-bit Linux linker
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Build extension and generator
        run: python tools/build_gdextension.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: infernal-godot-${{ matrix.target }}
          path: |
            godot/addons/infernal_diffusion/
            godot/addons/godobuf/
            godot/README.md
          if-no-files-found: error
